[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supernote-todo"
version = "0.1.0"
description = "Supernote To-Do görevlerini Apple Reminders veya Microsoft To Do'ya aktarır"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "msal>=1.24",
    # PyObjC 12 ships no wheels for Python 3.9 (macOS's built-in python3), and
    # building it from source fails without full Xcode.
    "pyobjc-framework-EventKit>=9,<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-EventKit>=9; sys_platform == 'darwin' and python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
supernote-todo = "supernote_todo.cli:main"

[tool.setuptools]
packages = ["supernote_todo"]
